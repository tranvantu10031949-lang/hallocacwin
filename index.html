<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffe6ef">
<title>♡ Halloween With Me ♡</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 overflow-x:hidden;font-family:Georgia,serif;color:#86566d;
 background:radial-gradient(ellipse at top,#fff8fb,transparent 65%),linear-gradient(135deg,#ffe6ef,#f8c9dc,#fceaf2);
 transition:background 1.5s,color 1.5s
}
.card{
 position:relative;width:min(90%,430px);padding:35px 22px;text-align:center;
 border:1px solid #ffffffd9;border-radius:28px;background:#fff9fcbd;
 box-shadow:0 15px 55px #d58ba533;backdrop-filter:blur(12px);
 animation:appear 1s ease;z-index:1
}
@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.moon{font-size:42px;margin-bottom:12px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(5deg)}}
h1{font-size:clamp(25px,7vw,33px);line-height:1.4;margin:10px 0;color:#bc7296;text-shadow:0 2px 15px #f2b7d5}
.subtitle{font-size:14px;letter-spacing:2px;color:#b78b9e;margin-bottom:25px}
.question{font-size:18px;line-height:1.8;margin:22px 0}
.buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
button{border:none;padding:13px 27px;border-radius:50px;font-size:16px;font-weight:bold;cursor:pointer;transition:.25s;font-family:inherit}
button:active{transform:scale(.94)}
#yes{background:linear-gradient(135deg,#f5a9ca,#d982ae);color:white;box-shadow:0 5px 18px #d982ae55}
#yes:hover{transform:translateY(-3px);box-shadow:0 8px 24px #d982ae88}
#no{color:#bd7b99;background:#fff;border:1px solid #f2cfdf}
.footer{font-size:12px;margin-top:25px;color:#c49bad}
.heart{position:fixed;top:-30px;pointer-events:none;color:#e6a3c2;animation:fall linear forwards;z-index:0}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
body.horror{background:#020106;color:#d8d0e8}
.horror .card{width:min(95%,550px);background:#09070fe8;border-color:#4a203d;box-shadow:0 0 45px #6d123f44;animation:horrorAppear 1.2s ease}
@keyframes horrorAppear{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
.horror h1{color:#edc5e5;text-shadow:0 0 18px #b00064}
.horror .subtitle,.horror .footer{color:#a58ba9}
.horror .question{color:#c8b7d4}
.horror-image{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:10px;margin:20px auto;opacity:0;filter:brightness(.5) contrast(1.2);box-shadow:0 0 30px #a0004744}
.horror-image.show{animation:reveal 2.5s ease forwards}
@keyframes reveal{
 0%{opacity:0;filter:brightness(0);transform:scale(.94)}
 35%{opacity:1;filter:brightness(.5) contrast(1.3)}
 42%{transform:translateX(-4px)}46%{transform:translateX(4px)}50%{transform:translateX(0)}
 100%{opacity:1;filter:brightness(.75) contrast(1.2);transform:scale(1)}
}
.horror .buttons,.horror .moon{display:none}
.whisper{font-size:14px;letter-spacing:3px;color:#d1a1c9;opacity:0;transition:opacity 2s}
.whisper.show{opacity:1}
#soundToggle{display:none;margin-top:16px;background:#24101f;border:1px solid #794263;color:#e7c7df;font-size:12px;padding:10px 16px}
.horror #soundToggle{display:inline-block}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card" id="card">
 <div class="moon">🌙</div>
 <div class="subtitle">♡ A LITTLE HALLOWEEN INVITATION ♡</div>

 <p class="question" id="question">Bạn muốn đón Halloween cùng mình không? 🎃</p>
 <div class="buttons">
  <button id="yes">Có ♡</button>
  <button id="no">Không</button>

 <p class="whisper" id="whisper">ĐỪNG QUAY LẠI...</p>
 <button id="soundToggle">Tắt âm thanh ♫</button>
 <div class="footer" id="footer">Made with ♡ just for Halloween</div>
</main>
<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const title=document.getElementById("title");
const question=document.getElementById("question");
const picture=document.getElementById("horrorImage");
const whisper=document.getElementById("whisper");
const soundToggle=document.getElementById("soundToggle");
let audioContext=null,masterGain=null,soundOn=true,soundNodes=[];

function makeWhisper(){
 audioContext=new(window.AudioContext||window.webkitAudioContext)();
 masterGain=audioContext.createGain();
 masterGain.gain.value=0.0001;
 masterGain.connect(audioContext.destination);
 const bufferSize=audioContext.sampleRate*3;
 const buffer=audioContext.createBuffer(1,bufferSize,audioContext.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<bufferSize;i++)data[i]=(Math.random()*2-1)*0.8;
 const noise=audioContext.createBufferSource();
 noise.buffer=buffer;noise.loop=true;
 const filter=audioContext.createBiquadFilter();
 filter.type="lowpass";filter.frequency.value=650;filter.Q.value=0.7;
 const slowFilter=audioContext.createBiquadFilter();
 slowFilter.type="bandpass";slowFilter.frequency.value=250;slowFilter.Q.value=0.5;
 const breathGain=audioContext.createGain();breathGain.gain.value=0.3;
 noise.connect(filter);filter.connect(slowFilter);slowFilter.connect(breathGain);breathGain.connect(masterGain);
 noise.start();
 const oscillator=audioContext.createOscillator(),lowGain=audioContext.createGain();
 oscillator.type="sine";oscillator.frequency.value=48;lowGain.gain.value=0.12;
 oscillator.connect(lowGain);lowGain.connect(masterGain);oscillator.start();
 const lfo=audioContext.createOscillator(),lfoGain=audioContext.createGain();
 lfo.frequency.value=0.18;lfoGain.gain.value=0.08;
 lfo.connect(lfoGain);lfoGain.connect(breathGain.gain);lfo.start();
 soundNodes=[noise,oscillator,lfo];
 if(soundOn)masterGain.gain.setTargetAtTime(0.65,audioContext.currentTime,1.2);
}
yes.addEventListener("click",async()=>{
 document.body.classList.add("horror");
 title.textContent="You shouldn't have said YES...";
 question.textContent="Mình biết bạn sẽ đến. Nhưng... bạn có nghe thấy không?";
 document.getElementById("footer").textContent="Nó đang ở ngay phía sau bạn.";
 picture.hidden=false;
 try{
  if(!audioContext)makeWhisper();
  if(audioContext.state==="suspended")await audioContext.resume();
 }catch(error){console.log("Không thể phát âm thanh:",error)}
 setTimeout(()=>{picture.classList.add("show");whisper.classList.add("show")},700);
});
no.addEventListener("click",()=>{window.location.replace("about:blank")});
soundToggle.addEventListener("click",async()=>{
 if(!audioContext||!masterGain)return;
 soundOn=!soundOn;
 if(soundOn){
  await audioContext.resume();
  masterGain.gain.setTargetAtTime(0.65,audioContext.currentTime,0.15);
  soundToggle.textContent="Tắt âm thanh ♫";
 }else{
  masterGain.gain.setTargetAtTime(0.0001,audioContext.currentTime,0.08);
  soundToggle.textContent="Bật âm thanh ♫";
 }
});
function createHeart(){
 if(document.body.classList.contains("horror"))return;
 const heart=document.createElement("span");
 heart.className="heart";
 heart.textContent=["♡","♥","✧","🎃"][Math.floor(Math.random()*4)];
 heart.style.left=Math.random()*100+"vw";
 heart.style.fontSize=(12+Math.random()*17)+"px";
 heart.style.opacity=0.3+Math.random()*0.5;
 heart.style.animationDuration=(5+Math.random()*5)+"s";
 document.body.appendChild(heart);
 setTimeout(()=>heart.remove(),11000);
}
setInterval(createHeart,500);
</script>
</body>
