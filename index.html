<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe6ef">
<title>Halloween With Me?</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 display:flex;align-items:center;justify-content:center;
 font-family:Georgia,serif;color:#965b79;
 background:radial-gradient(circle at top,#fff9fc,#f7c9dc 75%,#f2b8d0);
}
.invite{
 width:min(90vw,430px);padding:34px 22px;text-align:center;
 border:1px solid #fff;border-radius:28px;background:#fff9fce8;
 box-shadow:0 14px 55px #b75b8833;animation:enter .8s ease;
}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.moon{font-size:42px}
h1{font-size:clamp(28px,8vw,38px);line-height:1.3;color:#c05f91;text-shadow:0 0 15px #f4b9d4}
p{font-size:18px;line-height:1.7}
.buttons{display:flex;justify-content:center;gap:13px;margin-top:25px}
button{border:0;border-radius:40px;padding:13px 28px;font: bold 16px Georgia;cursor:pointer}
#yes{background:linear-gradient(135deg,#f4a1c4,#d86da4);color:white;box-shadow:0 5px 18px #d86da455}
#no{background:#fff;color:#b76b91;border:1px solid #efc5d8}
.hint{font-size:12px;color:#bd91a6;margin-top:24px}
#horror{
 display:none;position:fixed;inset:0;width:100%;height:100%;
 object-fit:cover;background:#000;z-index:5;
}
#horror.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
body.scare{background:#000}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="invite" id="invite">
 <div class="moon">🌙</div>
 <p style="letter-spacing:2px;font-size:12px">♡ A LITTLE HALLOWEEN INVITATION ♡</p>
 <h1>Halloween<br>With Me?</h1>
 <p>Bạn muốn đón Halloween cùng mình không? 🎃</p>
 <div class="buttons">
  <button id="yes">Có ♡</button>
  <button id="no">Không</button>
 </div>
 <div class="hint">Một lời mời nhỏ cho đêm Halloween...</div>
</main>

<img id="horror" alt="Halloween slideshow">

let current = 0;
let slideshowTimer = null;
let audioContext = null;
let master = null;
let soundOn = true;

function startWhisperSound(){
 const AudioCtx = window.AudioContext || window.webkitAudioContext;
 if(!AudioCtx) return;
 audioContext = new AudioCtx();
 master = audioContext.createGain();
 master.gain.value = 0.0001;
 master.connect(audioContext.destination);

 // Tiếng gió trầm và nhịp thở tổng hợp, không cần file âm thanh ngoài.
 const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 3, audioContext.sampleRate);
 const data = buffer.getChannelData(0);
 for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*0.8;

 const noise = audioContext.createBufferSource();
 noise.buffer = buffer;
 noise.loop = true;
 const filter = audioContext.createBiquadFilter();
 filter.type = "lowpass";
 filter.frequency.value = 520;
 const breath = audioContext.createGain();
 breath.gain.value = 0.25;
 noise.connect(filter);
 filter.connect(breath);
 breath.connect(master);
 noise.start();

 const bass = audioContext.createOscillator();
 bass.type = "sine";
 bass.frequency.value = 46;
 const bassGain = audioContext.createGain();
 bassGain.gain.value = 0.10;
 bass.connect(bassGain);
 bassGain.connect(master);
 bass.start();

 const lfo = audioContext.createOscillator();
 const lfoGain = audioContext.createGain();
 lfo.frequency.value = 0.17;
 lfoGain.gain.value = 0.12;
 lfo.connect(lfoGain);
 lfoGain.connect(breath.gain);
 lfo.start();

 master.gain.setTargetAtTime(0.48, audioContext.currentTime, 1.0);
}

function showNextImage(){
 current = (current + 1) % images.length;
 horror.style.opacity = "0";
 setTimeout(() => {
   horror.src = images[current];
   horror.onload = () => {
     horror.style.opacity = "1";
   };
   // If an image was cached, onload will still fire; fallback handles broken links.
   horror.onerror = () => {
     current = (current + 1) % images.length;
     horror.src = images[current];
   };
 }, 180);
}

yes.addEventListener("click", async () => {
 invite.style.display = "none";
 document.body.classList.add("scare");
 horror.classList.add("active");
 horror.src = images[0];
 try {
   startWhisperSound();
   if(audioContext && audioContext.state === "suspended") await audioContext.resume();
 } catch(e) {
   console.log("Âm thanh không khả dụng trên trình duyệt này.");
 }
 if(slideshowTimer) clearInterval(slideshowTimer);
 slideshowTimer = setInterval(showNextImage, 2000);
});
